services:
  - type: web
    name: citeguard-api-ee07b414
    runtime: python
    plan: free
    rootDir: citeguard-api/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CITEGUARD_MAILTO
        value: ee07b414@gmail.com
